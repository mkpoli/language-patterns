<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />

		<script>
			// Stamp the stored theme before first paint to avoid a flash.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				} catch (e) {
					// Unreadable storage means no stored preference; auto theme applies.
				}
			})();
		</script>

		<meta
			name="referrer"
			content="strict-origin-when-cross-origin"
		/>

		<meta
			name="generator"
			content="SvelteKit + Cloudflare Workers"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
